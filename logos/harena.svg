<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 112">
  <!-- Harena calligraphy mark: < | structure (stylized H) -->
  <g stroke="#111" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Upper diagonal of < (top-right to left-center) -->
    <path d="M78,6  L14,54" stroke-width="13"/>
    <!-- Lower diagonal of < (left-center to bottom-right) -->
    <path d="M14,54 L78,102" stroke-width="13"/>
    <!-- Vertical bar | on right side -->
    <path d="M92,6  L92,102" stroke-width="13"/>
    <!-- Cross-stroke 1 (thin diagonal, the ink drag) -->
    <path d="M22,14 L86,70"  stroke-width="5" opacity="0.3"/>
    <!-- Connecting crossbar at midpoint -->
    <path d="M14,54 L92,54"  stroke-width="7" opacity="0.5"/>
  </g>
  <!-- HARENA text -->
  <text x="116" y="74" font-family="Arial Black,Arial,sans-serif" font-size="52" font-weight="900" fill="#111" letter-spacing="1">HARENA</text>
</svg>
